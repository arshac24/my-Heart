<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Who Loves Who More 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 2.5rem;
      color: #d6336c;
      margin-bottom: 35px;
      animation: popIn 1s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    button {
      font-size: 1.2rem;
      padding: 15px 32px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #liahBtn {
      background-color: #ff4d6d;
      color: white;
      margin-right: 20px;
    }

    #liahBtn:hover {
      transform: scale(1.1);
    }

    #geniusBtn {
      background-color: #adb5bd;
      color: #333;
    }

    #message {
      display: none;
      font-size: 2rem;
      color: #d6336c;
      margin-top: 30px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="main">
    <h1>Who loves the other more?</h1>

    <div>
      <button id="liahBtn">Liah 💖</button>
      <button id="geniusBtn">Genius 😌</button>
    </div>
  </div>

  <div class="container" id="final" style="display:none;">
    <h1>Fine… I admit it 😭💘</h1>
    <div id="message">
      Liah loves Genius more…<br><br>
      But Genius loves Liah in a way that<br>
      words will never fully explain 💞
    </div>
  </div>

  <script>
    const liahBtn = document.getElementById("liahBtn");
    const geniusBtn = document.getElementById("geniusBtn");
    const main = document.getElementById("main");
    const final = document.getElementById("final");

    let scale = 1;

    geniusBtn.addEventListener("click", () => {
      scale += 0.2;
      liahBtn.style.transform = `scale(${scale})`;
    });

    liahBtn.addEventListener("click", () => {
      main.style.display = "none";
      final.style.display = "block";
    });

    // Floating hearts generator
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💗";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 4 + "s";
      heart.style.fontSize = 18 + Math.random() * 20 + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 300);
  </script>

</body>

</html>
